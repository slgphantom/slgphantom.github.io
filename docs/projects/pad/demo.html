        @media only screen and (max-width: 600px) {
            body {
                /* Dotted Background - Deep Purple 500 
                background-image: radial-gradient(#673AB7 10%, #ffffff 10%);
                background-size: 5px 5px;
                background-position: 0 0;

            }

            .Content.mce-content-body[data-mce-placeholder] {
                height: 30vh;
            }
        }

        body {
            /* Dotted Background - Deep Purple 500
            background-image: radial-gradient(#673AB7 10%, #ffffff 10%);
            background-size: 10px 10px;
            background-position: 0 0;
            width: 100%;*/
        }

        h1, h2, h3, h4 {
            color: #424242;
        }

        h1 {
            font-size: 32px;
        }

        h2, h3 {
            font-size: 20px;
        }

        div:focus, textarea:focus, summary:focus, button:focus, input:focus, .form-control:focus {
            outline: none !important;
            border: 0px !important;
            border-color: rgba(0,0,0,0) !important;
            box-shadow: 0px 0px rgba(0,0,0,0) !important;
        }

        .tox-notification.tox-notification--in.tox-notification--warning {
            Display: None;
        }

        /* Title & Subtitle */
        .jumbotron {
            background: #FFFFFF;
            height: 120px;
        }

        #title {
            background: rgba(0,0,0,0);
            border-color: rgba(0,0,0,0);
            height: 45px;
            width: 100%;
            resize: none;
        }

        #subtitle {
            background: rgba(0,0,0,0);
            border-color: rgba(0,0,0,0);
            height: 30px;
            width: 100%;
            resize: none;
        }

        /* Main Typing Area*/
        #main {
            min-height: 10vh;
        }

        [contentEditable=true]:empty:not(:focus):before {
            content: attr(data-text);
            color: gray;
        }

        .content {
            width: 100%;
            background: rgba(0,0,0,0);
            border-color: rgba(0,0,0,0);
            resize: none;

    <script>
        //Warn user before leaving web page with unsaved changes
        "use strict";
        (()=>{
            const modified_inputs = new Set;
            const defaultValue = "defaultValue";
            // store default values
            addEventListener("beforeinput", (evt)=>{
                const target = evt.target;
                if (!(defaultValue in target || defaultValue in target.dataset)) {
                    target.dataset[defaultValue] = ("" + (target.value || target.textContent)).trim();
                }
            }
            );
            // detect input modifications
            addEventListener("input", (evt)=>{
                const target = evt.target;
                let original;
                if (defaultValue in target) {
                    original = target[defaultValue];
                } else {
                    original = target.dataset[defaultValue];
                }
                if (original !== ("" + (target.value || target.textContent)).trim()) {
                    if (!modified_inputs.has(target)) {
                        modified_inputs.add(target);
                    }
                } else if (modified_inputs.has(target)) {
                    modified_inputs.delete(target);
                }
            }
            );
            addEventListener("beforeunload", (evt)=>{
                if (modified_inputs.size) {
                    const unsaved_changes_warning = "Changes you made may not be saved.";
                    evt.returnValue = unsaved_changes_warning;
                    return unsaved_changes_warning;
                }
            }
            );
        }
        )();

        function convertImagesToBase64() {
            var contentDocument = tinymce.get('mce_0').getDoc();
            var regularImages = contentDocument.querySelectorAll("img");
            var canvas = document.createElement('canvas');
            var ctx = canvas.getContext('2d');
            [].forEach.call(regularImages, function(imgElement) {
                // preparing canvas for drawing
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                canvas.width = imgElement.width;
                canvas.height = imgElement.height;

                ctx.drawImage(imgElement, 0, 0);
                // by default toDataURL() produces png image, but you can also export to jpeg
                // checkout function's documentation for more details
                var dataURL = canvas.toDataURL();
                imgElement.setAttribute('src', dataURL);
            })
            canvas.remove();
        }

        // Translate
        // Token Generation - https://github.com/xlzy520/translater
        var b = function(a, b) {
            for (var d = 0; d < b.length - 2; d += 3) {
                var c = b.charAt(d + 2)
                  , c = c >= 'a' ? c.charCodeAt(0) - 87 : Number(c)
                  , c = b.charAt(d + 1) == '+' ? a >>> c : a << c
                a = b.charAt(d) == '+' ? a + c & 4294967295 : a ^ c
            }
            return a
        }

            for (var e = TKK.split('.'), h = Number(e[0]) || 0, g = [], d = 0, f = 0; f < a.length; f++) {
                var c = a.charCodeAt(f)
                c < 128 ? g[d++] = c : (c < 2048 ? g[d++] = c >> 6 | 192 : ((c & 64512) == 55296 && f + 1 < a.length && (a.charCodeAt(f + 1) & 64512) == 56320 ? (c = 65536 + ((c & 1023) << 10) + (a.charCodeAt(++f) & 1023),
                g[d++] = c >> 18 | 240,
                g[d++] = c >> 12 & 63 | 128) : g[d++] = c >> 12 | 224,
                g[d++] = c >> 6 & 63 | 128),
                g[d++] = c & 63 | 128)
            }
            a = h
            for (d = 0; d < g.length; d++)
                a += g[d],
                a = b(a, '+-a^+6')
            a = b(a, '+-3^+b+-f')
            a ^= Number(e[1]) || 0
            a < 0 && (a = (a & 2147483647) + 2147483648)
            a %= 1E6
            return a.toString() + '.' + (a ^ h)
        }

        document.getElementById("query").addEventListener("keyup", function(event) {
            // Number 13 is the "Enter" key on the keyboard
            if (event.keyCode === 13) {
                // Cancel the default action, if needed

        document.getElementById('translate_button').addEventListener('click', function(e) {

            var r = document.getElementById("result");
            document.getElementById("result").value = "loading...";
            var english = /^[A-Za-z0-9' ]*$/;
            var proxyUrl = "https://cors-anywhere.herokuapp.com/";
            //fallback CORS proxy
            //var proxyUrl = "https://test.cors.workers.dev/?";
            var q = document.getElementById("query").value;
            if (english.test(q)) {
                var url = "https://translate.google.com/translate_a/t?client=webapp&sl=en&tl=zh-TW&hl=zh-TW&v=1.0&source=is&tk=" + tk(q) + "&q=" + q;
            } else {

            )
